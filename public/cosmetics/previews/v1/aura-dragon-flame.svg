<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
<g opacity="0.32"><!-- Base Duck Body -->
  <!-- Feet -->
  <path d="M178 402 c2 18 -8 30 -30 40 c24 6 48 0 64 -18" fill="none" stroke="#FF9B42" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M178 402 c2 18 -8 30 -30 40 c24 6 48 0 64 -18" fill="none" stroke="#1B132B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
  <path d="M238 386 c2 18 -8 30 -30 40 c24 4 46 0 62 -16" fill="none" stroke="#FF9B42" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M238 386 c2 18 -8 30 -30 40 c24 4 46 0 62 -16" fill="none" stroke="#1B132B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>

  <!-- Tail Feathers -->
  <path d="M94 322 c-18 -16 -30 -36 -34 -58 c28 8 52 20 70 34" fill="#FFD84D" stroke="#1B132B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main Torso Body -->
  <path d="M80 328 c0 -72 70 -114 164 -110 c92 2 156 44 166 102 c14 68 -52 102 -166 98 c-108 -2 -164 -34 -164 -90 Z" fill="#FFD84D" stroke="#1B132B" stroke-width="14" stroke-linejoin="round"/>
  
  <!-- Torso Shadow Form -->
  <path d="M84 340 c10 42 60 72 150 72 c74 0 134 -20 162 -54 c-22 56 -86 82 -168 80 c-94 -2 -144 -36 -144 -98 Z" fill="#E5A812" opacity="0.55"/>

  <!-- Head & Neck -->
  <path d="M212 216 c-10 -62 14 -126 66 -158 c54 -34 118 -16 150 30 c36 50 20 118 -20 156 c-44 44 -118 54 -166 18 c-16 -12 -26 -28 -30 -46 Z" fill="#FFD84D" stroke="#1B132B" stroke-width="14" stroke-linejoin="round"/>

  <!-- Head Highlight & Shadow Form -->
  <path d="M296 74 c34 -20 72 -14 96 14 c16 18 18 42 8 66 c-4 -28 -24 -56 -62 -66 c-18 -4 -32 -2 -42 -14 Z" fill="#FFF1A8" opacity="0.75"/>
  <path d="M216 220 c6 14 18 24 34 32 c-16 -8 -26 -18 -34 -32 Z" fill="#E5A812" opacity="0.6"/>

  <!-- Wing Silhouette & Highlight -->
  <path d="M136 316 c32 -40 90 -50 138 -24 c-14 50 -76 78 -132 58" fill="#FFF1A8" opacity="0.4"/>
  <path d="M136 316 c32 -40 90 -50 138 -24 c-14 50 -76 78 -132 58" fill="none" stroke="#1B132B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cheeks / Blush (Soft accent) -->
  <circle cx="270" cy="190" r="14" fill="#FF78A8" opacity="0.45"/>

  <!-- Left Eye -->
  <ellipse cx="320" cy="138" rx="42" ry="50" fill="#FFFDF4" stroke="#1B132B" stroke-width="8"/>
  <ellipse cx="330" cy="152" rx="11" ry="18" fill="#1B132B"/>
  <circle cx="326" cy="144" r="5" fill="#FFFDF4"/>

  <!-- Right Eye -->
  <ellipse cx="382" cy="144" rx="32" ry="42" fill="#FFFDF4" stroke="#1B132B" stroke-width="8"/>
  <ellipse cx="390" cy="156" rx="9" ry="16" fill="#1B132B"/>
  <circle cx="388" cy="150" r="4" fill="#FFFDF4"/>

  <!-- Orange Beak -->
  <path d="M354 186 c34 -2 68 8 110 22 c18 6 18 22 0 32 c-40 20 -84 24 -118 10 c-20 -8 -24 -28 -10 -46 c6 -8 12 -14 18 -18 Z" fill="#FF9B42" stroke="#1B132B" stroke-width="14" stroke-linejoin="round"/>
  <!-- Beak Top Highlight -->
  <path d="M362 192 c28 0 54 8 84 18" stroke="#FFD099" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Beak Smile Crease & Shadow -->
  <path d="M342 230 c38 10 78 6 120 -10" stroke="#C95E24" stroke-width="8" stroke-linecap="round" fill="none"/></g>
<g id="aura-astral-dragon">
      <defs>
        <filter id="dragon-glow-512" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <style>
          @keyframes dragon-coil-512 { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
          @keyframes ember-rise-512 { 0% { transform: translateY(0) scale(0.6); opacity: 0; } 50% { opacity: 0.9; } 100% { transform: translateY(-100px) scale(1.1); opacity: 0; } }
        </style>
      </defs>
      <g filter="url(#dragon-glow-512)">
        <!-- Soft background flame with silhouette clearance -->
        <g transform-origin="256 274">
          <circle cx="256" cy="274" r="190" fill="#DC2626" opacity="0.18"/>
          <circle cx="256" cy="274" r="140" fill="#F59E0B" opacity="0.22"/>
        </g>
        <g style="animation: dragon-coil-512 4s ease-in-out infinite" transform-origin="256 274">
          <path d="M70 340 C40 210, 130 90, 260 70 C380 50, 470 130, 460 250 C450 340, 390 410, 300 420 C200 430, 120 370, 160 300 C190 240, 280 240, 310 290" fill="none" stroke="#DC2626" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
          <path d="M70 340 C40 210, 130 90, 260 70 C380 50, 470 130, 460 250 C450 340, 390 410, 300 420 C200 430, 120 370, 160 300 C190 240, 280 240, 310 290" fill="none" stroke="#FBBF24" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- Dragon Head on outer left -->
          <g transform="translate(60, 170) rotate(-20)">
            <path d="M20 40 C10 10, 60 10, 90 30 C100 35, 110 55, 95 65 C80 75, 40 70, 20 40 Z" fill="#DC2626" stroke="#1B132B" stroke-width="4"/>
            <circle cx="50" cy="35" r="5" fill="#FEF08A"/>
            <path d="M85 40 C110 30, 140 45, 160 35" stroke="#FDE047" stroke-width="4" fill="none" stroke-linecap="round"/>
          </g>
          <!-- Flaming pearl on outer right -->
          <circle cx="440" cy="320" r="16" fill="#FEF08A" stroke="#F97316" stroke-width="4"/>
        </g>
        <!-- Subtle rising embers -->
        <g fill="#FDE047">
          <circle cx="100" cy="400" r="4" style="animation: ember-rise-512 2.2s infinite"/>
          <circle cx="420" cy="380" r="5" style="animation: ember-rise-512 1.9s infinite 0.3s"/>
        </g>
      </g>
    </g>
</svg>
