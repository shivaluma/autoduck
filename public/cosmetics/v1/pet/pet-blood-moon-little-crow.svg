<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
<g id="pet-companion">
    <defs>
      <style>
        @keyframes pet-bob-512 {
          0%, 100% { transform: translateY(0px); }
          50% { transform: translateY(-8px); }
        }
      </style>
    </defs>
    <g style="animation: pet-bob-512 2.4s ease-in-out infinite">
      <!-- Blood Moon Little Crow -->
      <polygon points="415,360 455,360 445,395 425,395" fill="#18181B" stroke="#1B132B" stroke-width="8"/>
      <polygon points="410,360 430,335 445,360" fill="#991B1B" stroke="#1B132B" stroke-width="8"/>
      <polygon points="445,345 465,350 445,355" fill="#F59E0B" stroke="#1B132B" stroke-width="4"/>
      <circle cx="435" cy="348" r="3" fill="#EF4444"/>
      <rect x="428" y="365" width="8" height="18" rx="2" fill="#FFFDF4" stroke="#1B132B" stroke-width="4"/>
      <line x1="432" y1="368" x2="432" y2="380" stroke="#DC2626" stroke-width="4"/>
    </g>
  </g>
</svg>
