<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
<g id="aura-fairy-fireflies">
    <defs>
      <style>@keyframes firefly-bob-1 { 0%, 100% { transform: translate(0, 0); opacity: 0.4; } 50% { transform: translate(8px, -14px); opacity: 0.9; } }</style>
    </defs>
    <ellipse cx="256" cy="274" rx="190" ry="155" fill="#059669" opacity="0.18"/>
    
      <g transform="translate(90, 160)" style="animation: firefly-bob-1 2.2s ease-in-out infinite 0s">
        <circle cx="0" cy="0" r="8" fill="#FDE047" stroke="#34D399" stroke-width="4"/>
        <circle cx="0" cy="0" r="4" fill="#FFFDF4"/>
      </g>
    
      <g transform="translate(140, 100)" style="animation: firefly-bob-1 2.2s ease-in-out infinite 0.3s">
        <circle cx="0" cy="0" r="10" fill="#FDE047" stroke="#34D399" stroke-width="4"/>
        <circle cx="0" cy="0" r="5" fill="#FFFDF4"/>
      </g>
    
      <g transform="translate(370, 90)" style="animation: firefly-bob-1 2.2s ease-in-out infinite 0.6s">
        <circle cx="0" cy="0" r="9" fill="#FDE047" stroke="#34D399" stroke-width="4"/>
        <circle cx="0" cy="0" r="4.5" fill="#FFFDF4"/>
      </g>
    
      <g transform="translate(430, 170)" style="animation: firefly-bob-1 2.2s ease-in-out infinite 0.8999999999999999s">
        <circle cx="0" cy="0" r="10" fill="#FDE047" stroke="#34D399" stroke-width="4"/>
        <circle cx="0" cy="0" r="5" fill="#FFFDF4"/>
      </g>
    
      <g transform="translate(440, 310)" style="animation: firefly-bob-1 2.2s ease-in-out infinite 1.2s">
        <circle cx="0" cy="0" r="9" fill="#FDE047" stroke="#34D399" stroke-width="4"/>
        <circle cx="0" cy="0" r="4.5" fill="#FFFDF4"/>
      </g>
    
  </g>
</svg>
