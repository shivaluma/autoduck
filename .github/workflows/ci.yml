name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Matches the Node in the runtime image (node:24.14.1-bookworm-slim, see Dockerfile).
  NODE_VERSION: '24.14.1'
  PNPM_VERSION: '11.22.0'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  NEXT_TELEMETRY_DISABLED: '1'

# TODO(plan step 0.4): add the `track-format` job (replay-track encode/decode fixtures).


# bash -eo pipefail: a failing command piped into tee still fails the step.
defaults:
  run:
    shell: bash

jobs:
  ts:
    name: ts (lint, test, build, cosmetics)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ env.PNPM_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ env.PNPM_VERSION }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm lint
      - run: pnpm test
      # tsc + vite build (the SPA), then the Next build that still serves app/api (plan Phase 4).
      - run: pnpm build
      - name: Client bundle (no node:crypto; home and rules load no engine, Phaser or WASM)
        run: pnpm check:bundle
      - run: pnpm build:api:next
      - run: pnpm cosmetics:validate

  migrations:
    name: migrations (fresh DB, idempotent app migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:${{ github.workspace }}/ci-migrations.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ env.PNPM_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ env.PNPM_VERSION }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate

      - name: Create an empty SQLite DB from the schema
        run: pnpm exec prisma db push </dev/null

      - name: App migrations, first run
        run: pnpm exec tsx scripts/run-migrations.ts

      - name: App migrations, second run must apply nothing
        run: |
          pnpm exec tsx scripts/run-migrations.ts | tee second-run.log
          if grep -q 'RUN ' second-run.log; then
            echo "::error::The second run re-applied migrations; every app migration must be recorded once and be idempotent."
            exit 1
          fi

  client-boundary:
    name: client-boundary (browser code reaches the engine only through src/engine seams)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Plan D18/D26: src/ and components/ must not reference packages/race-*, lib/season3(-race), or
      # lib/racing/ anywhere outside the src/engine/* seams (which re-export the TS engine on main and the
      # Rust/WASM build on the rewrite branch). The browser-side DTRK decoder and format live in
      # src/race/replay-track; lib/racing/replay-track imports them from there.
      - name: No engine or server imports outside src/engine/*
        run: |
          pattern="packages/race-|lib/season3(-race)?(\.ts)?['\"]|lib/racing/"
          if hits="$(grep -rnE "$pattern" src components | grep -v '^src/engine/')"; then
            echo "$hits"
            echo "::error::Browser code must import the engine through src/engine/{catalog,protocol,sim}.ts, not packages/race-*, lib/season3* or lib/racing/."
            exit 1
          fi
          echo "client-boundary: clean"

  docker:
    name: docker (build, size, push on main)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/shivaluma/autoduck:ts-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image size
        run: |
          bytes="$(docker image inspect --format '{{.Size}}' "$IMAGE")"
          mib="$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1048576 }')"
          echo "Image ${IMAGE}: ${mib} MiB (${bytes} bytes)"
          {
            echo "### Docker image"
            echo ""
            echo "| Image | Size |"
            echo "|---|---|"
            echo "| \`${IMAGE}\` | ${mib} MiB |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE"
