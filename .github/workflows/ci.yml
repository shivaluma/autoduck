name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Matches the Node of the Dockerfile's web stage (node:24.14.1-bookworm-slim).
  NODE_VERSION: '24.14.1'
  PNPM_VERSION: '11.22.0'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

# bash -eo pipefail: a failing command piped into tee still fails the step.
defaults:
  run:
    shell: bash

jobs:
  ts:
    name: ts (lint, test, build, cosmetics)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ runner.os }}-${{ env.PNPM_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ env.PNPM_VERSION }}-

      # Phase 5: `pnpm build` first builds the browser engine (race-core as WASM, scripts/build-wasm.sh),
      # so this job needs the pinned toolchain, the wasm target and the wasm-bindgen CLI of Cargo.lock (D27).
      - name: Read pinned toolchain and wasm-bindgen version
        id: pins
        run: |
          echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
          version="$(awk '/^\[\[package\]\]/{name=""} /^name = "wasm-bindgen"$/{name=$3} name!="" && /^version = /{gsub(/"/,"",$3); print $3; exit}' Cargo.lock)"
          test -n "$version"
          echo "wasm_bindgen=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pins.outputs.channel }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.pins.outputs.wasm_bindgen }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # wasm + tsc + vite build (the SPA; the Rust server serves the API, rust.yml).
      - run: pnpm build
      # After the build: tests/wasm-engine.test.ts loads the WASM package it produced.
      - run: pnpm test
      - name: Client bundle (no node:crypto; home and rules load no engine, Phaser or WASM)
        run: pnpm check:bundle
      - run: pnpm cosmetics:validate

      # Plan 0.8 / D19: the Rust server embeds the cosmetic catalog exported from lib/cosmetics (the TS
      # catalog stays the source of truth). crates/server/data/required-ts-migrations.json is frozen
      # (its generator, scripts/run-migrations.ts, was retired in Phase 9).
      - name: Cosmetic exports for the Rust server are in sync (crates/server/data)
        run: pnpm cosmetics:export-catalog --check

  docker:
    name: docker (Rust server + SPA image: build, boot, size, push on main)
    runs-on: ubuntu-latest
    # A cold release build of the server and the wasm engine.
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/shivaluma/autoduck:rust-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image refuses a missing DB (and never creates one), then boots on a scratch DB with the
      # baseline schema and answers /api/health and the SPA.
      - name: Boot smoke test
        run: |
          data="$RUNNER_TEMP/data"; mkdir -p "$data"
          if docker run --rm -v "$data:/app/data" "$IMAGE"; then
            echo "::error::the image booted without a database"; exit 1
          fi
          test ! -e "$data/autoduck.db"
          docker run --rm -i -v "$data:/app/data" --entrypoint sqlite3 "$IMAGE" /app/data/autoduck.db \
            < crates/server/migrations/0001_baseline.sql
          docker run -d --name smoke -p 3000:3000 -v "$data:/app/data" \
            -e AUTODUCK_ENV=dev -e AUTODUCK_ALLOW_EMPTY_DB=1 "$IMAGE"
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS http://127.0.0.1:3000/season-3 | grep -q '<div id="root">'
          docker stop smoke
          docker logs smoke 2>&1 | tail -40
          docker rm smoke

      - name: Report image size
        run: |
          bytes="$(docker image inspect --format '{{.Size}}' "$IMAGE")"
          mib="$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1048576 }')"
          echo "Image ${IMAGE}: ${mib} MiB (${bytes} bytes)"
          {
            echo "### Docker image"
            echo ""
            echo "| Image | Size |"
            echo "|---|---|"
            echo "| \`${IMAGE}\` | ${mib} MiB |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE"
