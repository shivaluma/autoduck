[package]
name = "race-core"
description = "Deterministic Season 3 race simulation (no_std + alloc, bit-identical native and wasm; D1, D4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = []
std = ["race-protocol/std", "serde/std", "serde_json/std"]
# D3/D6: TS-oracle compatibility (V8 hypot/exp/pow ports, ICU id collation).
ts-compat = ["race-protocol/ts-compat"]

[dependencies]
race-protocol = { workspace = true }
serde = { workspace = true }
# D4(d): declared directly so every graph parses floats with correct rounding.
serde_json = { workspace = true }
libm = { workspace = true }
ryu-js = { workspace = true }
sha2 = { workspace = true }

[build-dependencies]
sha2 = { version = "=0.11.1" }

[dev-dependencies]
# Test-only: reads the gzip RNG fixtures (tests/rng.rs).
flate2 = { workspace = true }
