packages:
  - '.'

allowBuilds:
  '@prisma/engines': set this to true or false
  better-sqlite3: set this to true or false
  esbuild: true
  msw: false
  prisma: set this to true or false

# Transitive versions held back to releases at least two weeks old (vite 8.3.5 accepts rolldown ~1.2.14;
# eslint-plugin-react's resolve accepts is-core-module ^2.16).
overrides:
  is-core-module: 2.17.0
  rolldown: 1.2.15
