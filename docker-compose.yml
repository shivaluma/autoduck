# Local run of the production image (Rust server + Vite SPA). The database must already exist in the
# volume: the server refuses a missing or empty DB (set AUTODUCK_ALLOW_EMPTY_DB=1, then `autoduck seed`,
# for a fresh one). Production runs on Dokploy with replicas 1 and stop-first updates (plan D21).
services:
  autoduck:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/autoduck.db
      - RACE_SECRET_KEY=${RACE_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    volumes:
      - autoduck-data:/app/data
    stop_grace_period: 150s
    restart: unless-stopped

volumes:
  autoduck-data:
