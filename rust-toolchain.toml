# D27: pinned stable toolchain. Bumping `channel` is an engine change: the
# channel and the compiler's release/commit/LLVM version are part of
# ENGINE_BUILD_ID (crates/race-core/build/engine_build_id.rs), and the bump is
# gated by `golden-version`. `wasm32v1-none` (no std at all) proves the engine
# crates and their dependencies are really no_std (CI `wasm` job).
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt"]
targets = ["wasm32-unknown-unknown", "wasm32-wasip1", "wasm32v1-none"]
profile = "minimal"
